<style>
/* Palette lifted from the 台灣大挑戰 logo: navy field, and the four transport
   accents (blue rail / green road / yellow HSR / red pin) reused as the card
   category colours so a row is recognisable before you read its title.
   Cards are flat single-colour blocks — no gradients, no hover states. */
:root{
  --navy:#0d2350;
  --navy-deep:#081737;
  --blue:#1a6fd4;
  --green:#00a05a;
  --yellow:#f5b800;
  --red:#e8312f;
  --ink:#f4f7fb;
  --muted:#9db0cd;
  --nav-h:56px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  /* Navy field with a soft bloom behind the nav, so the top isn't flat. */
  background:
    radial-gradient(120% 60% at 50% -10%, #16305f 0%, transparent 60%),
    var(--navy-deep);
  background-attachment:fixed;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
a{color:inherit;text-decoration:none;}

/* ---- background: the island itself ----
   Fixed behind everything, bleeding off the top and bottom of the viewport, so
   scrolling the cards reads as travelling down the island. The faint lat/lon
   graticule gives the empty navy some structure. */
.bg{
  position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  background:
    repeating-linear-gradient(to right, rgba(255,255,255,.022) 0 1px, transparent 1px 68px),
    repeating-linear-gradient(to bottom, rgba(255,255,255,.022) 0 1px, transparent 1px 68px);
}
.bg-tw{
  position:absolute; top:-6vh; right:-4vw; height:112vh; width:auto;
  filter:drop-shadow(0 0 44px rgba(0,160,90,.35));
}
/* A second, offset copy of the same outline — a hard "sticker" shadow that
   keeps the shape legible where it overlaps the cards. */
.bg-tw.ghost{
  right:-6vw; top:-4vh;
  filter:none; opacity:.5;
}
body > .nav, body > .hero, body > main, body > footer{position:relative; z-index:1;}

@media (max-width:700px){
  /* On a phone the island would sit right under the cards, so push it out to
     the edge and shrink it into a watermark. */
  .bg-tw{height:88vh; top:auto; bottom:-8vh; right:-22vw;}
  .bg-tw.ghost{display:none;}
}

/* ---- hero ---- */
.hero{padding:30px 18px 4px; text-align:center;}
.hero h1{font-size:clamp(21px,5.6vw,30px); margin:0 0 8px; font-weight:800; letter-spacing:.05em;}
.hero p{margin:0 auto; max-width:32em; color:var(--ink); font-size:14.5px;}

/* ---- rows ---- */
main{max-width:1100px; margin:0 auto; padding:4px 14px 52px;}
.row{margin:28px 0 0;}
.row-head{display:flex; align-items:center; gap:9px; margin:0 2px 11px;}
.row-head h2{font-size:16px; margin:0; font-weight:800; letter-spacing:.04em;}
.row-head .bar{width:5px; height:18px; border-radius:2px; background:var(--rc);}
.row-head .count{font-size:12px; color:var(--muted);}

.cards{display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(228px,1fr));}

/* Translucent HUD panel: the row colour only tints the glass and lights the
   edges, so weight comes from the outline and the grid, not a colour fill. */
.card{
  position:relative; display:flex; flex-direction:column; justify-content:flex-end;
  min-height:132px; padding:14px;
  color:#eef3fa;
  border:1px solid color-mix(in srgb, var(--rc) 55%, transparent);
  border-radius:10px;
  background:
    rgba(10,26,56,.55);
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  box-shadow:
    inset 0 1px 0 color-mix(in srgb, var(--rc) 45%, transparent),
    0 0 0 1px rgba(0,0,0,.35),
    0 8px 22px rgba(0,0,0,.35);
  overflow:hidden;
  isolation:isolate;
}
/* Faint circuit grid + a colour bloom in the corner. Both sit behind content. */
.card::before{
  content:""; position:absolute; inset:0; z-index:-1;
  background:rgba(10,26,56,.55);
}
/* Bracket in the top-left corner — the HUD tell. */
.card::after{
  content:""; position:absolute; top:9px; left:9px; width:13px; height:13px;
  border-top:2px solid var(--rc); border-left:2px solid var(--rc);
  border-top-left-radius:3px; opacity:.9;
}
.card .glyph{
  position:absolute; top:9px; right:11px;
  font-size:28px; line-height:1; opacity:.5;
}
.card h3{margin:26px 0 5px; font-size:17px; font-weight:800; letter-spacing:.02em;}
.card p{margin:0; font-size:13px; line-height:1.45; color:--ink;}
.card .go{
  margin-top:10px; font-size:11px; font-weight:800; letter-spacing:.12em;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--rc);
  filter:brightness(1.35);
}
.card .badge{
  position:absolute; top:10px; left:28px;
  font-size:10px; font-weight:800; letter-spacing:.14em;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  padding:2px 6px; border-radius:3px;
  border:1px solid color-mix(in srgb, var(--rc) 70%, transparent);
  background:color-mix(in srgb, var(--rc) 22%, transparent);
  color:#fff;
}
.card:active{border-color:var(--rc);}
.card:focus-visible{outline:2px solid #fff; outline-offset:2px;}

footer{text-align:center; padding:0 20px 40px; color:var(--muted); font-size:13px;}
footer a{text-decoration:underline; text-underline-offset:3px;}

@media (max-width:560px){
  .nav .brand b{display:none;}
  .cards{grid-template-columns:repeat(2,1fr); gap:10px;}
  .card{min-height:114px; padding:12px;}
  .card h3{font-size:15px;}
  .card p{font-size:12px;}
  .card .glyph{font-size:24px;}
}
</style>
</head>

</footer>

<script>
// One place to add a new game: append to the right row and it shows up in both
// the nav picker and the card grid.
const ROWS = [
  { title:'捷運挑戰', color:'var(--blue)', games:[
    { title:'雙北捷運',   teaser:'紅橘藍綠棕加環狀線，一百多站你記得幾個？', path:'/projects/metro/',      glyph:'🚇' },
    { title:'高雄捷運',   teaser:'紅線、橘線，再加上環狀輕軌一圈。',         path:'/projects/khh_metro/',  glyph:'🚈' },
  ]},
  { title:'國道挑戰', color:'var(--green)', games:[
    { title:'國道一號',   teaser:'中山高速公路，交流道、系統、服務區。',   path:'/projects/freeway/',    glyph:'🛣️', badge:'NEW' },
    { title:'國道三號',   teaser:'福爾摩沙高速公路，交流道、系統、服務區。',           path:'/projects/freeway3/',   glyph:'🛣️', badge:'NEW' },
  ]},
  { title:'鐵路挑戰', color:'var(--yellow)', games:[
    { title:'台鐵西部幹線', teaser:'山線海線一百多個站，基隆到屏東。',     path:'/projects/tra/',        glyph:'🚆' },
    // { title:'台鐵東部幹線', teaser:'宜蘭、花東縱谷、南迴，一路到屏東。',     path:'/projects/tra-east/',   glyph:'🚂', badge:'NEW' },
  ]},
  { title:'其他挑戰', color:'var(--red)', games:[
    { title:'台灣九宮格', teaser:'每天一題，回答 3×3 在台灣有名的人九宮格。', path:'/projects/taiwan-grid/', glyph:'📍' },
    { title:'日本車牌制霸 App', teaser:'蒐集日本各地車牌的 iOS App。',          path:'https://apps.apple.com/ph/app/id6774146443', glyph:'🚗', external:true },
  ]},
];

const attrs = g => g.external ? ' target="_blank" rel="nofollow noopener"' : '';

document.getElementById('rows').innerHTML = ROWS.map(row => `
  <section class="row" style="--rc:${row.color}">
    <div class="row-head">
      <span class="bar"></span>
      <h2>${row.title}</h2>
    </div>
    <div class="cards">
      ${row.games.map(g => `
        <a class="card" href="${g.path}"${attrs(g)}>
          <span class="glyph" aria-hidden="true">${g.glyph}</span>
          ${g.badge ? `<span class="badge">${g.badge}</span>` : ''}
          <h3>${g.title}</h3>
          <p>${g.teaser}</p>
          <span class="go">${g.external ? 'App Store →' : '開始挑戰 →'}</span>
        </a>`).join('')}
    </div>
  </section>`).join('');
</script>
