  aliases: {
    "cks":"cks", "chiangkaishek":"cks", "chiangkaishekmemorialhall":"cks",
    "ntuhospital":"ntuhospital", "taidahospital":"ntuhospital", "ntuh":"ntuhospital",
    "taipei101":"taipei101", "台北101":"taipei101", "worldtradecenter":"taipei101", "wtc":"taipei101",
    "sysmemorialhall":"sunyatsen", "sunyatsenmemorialhall":"sunyatsen",

  // Checked top-down; the first threshold the score clears wins.
  ranks: [
    {min:90, title:'捷運大師',   quip:'雙北的路網都在你腦裡，如果沒有偷看，那真的很強。'},
    {min:80, title:'捷運中師',   quip:'幾乎滴水不漏，可能就差三鶯線。'},
    {min:70, title:'捷運小師',   quip:'主要幹線閉著眼都能背，猛。'},
    {min:60, title:'捷運達人',   quip:'常搭的線路一站不漏，出了舒適圈就開始猜。'},
    {min:50, title:'捷運熟客',   quip:'一半的雙北在你腦中，剩下一半靠 Google Maps。'},
    {min:40, title:'捷運通勤族', quip:'家、公司、還有那間常去的餐廳，其他就先不管了。'},
