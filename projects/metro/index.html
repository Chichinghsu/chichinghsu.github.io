<script type="module">
async function main() {
    const response = await fetch("stations.json");
    const DATA = await response.json();

    init(DATA);
}

function init(DATA){
  const stations = DATA.stations;
  const lines = DATA.lines;
  const lineMeta = DATA.lineMeta;

  // ---- projection: lat/lon -> local x/y ----
  // Scale is derived from the CORE network only (the original 6 lines), so the
  // dense city center stays readable. Newer far-flung branches (Airport MRT,
  // Sanying Line) are projected the same way but then compressed asymptotically
  // into a margin band around the core — this is schematic, not GPS-accurate,
  // by design (distant suburbs get "folded in" the way real transit diagrams do).
  const core = stations.filter(s=>s.core);
  const lats = core.map(s=>s.lat), lons = core.map(s=>s.lon);
  const latMin = Math.min(...lats), latMax = Math.max(...lats);
  const lonMin = Math.min(...lons), lonMax = Math.max(...lons);
  const latMid = (latMin+latMax)/2;
  const cosLat = Math.cos(latMid*Math.PI/180);
  const PAD = 40;
  const MARGIN = 150; // extra compressed band for outer branches
  const CW = 760, CH = 900; // core plot area
  const W = CW + 2*MARGIN, H = CH + 2*MARGIN;
  const spanX = (lonMax-lonMin)*cosLat;
  const spanY = (latMax-latMin);
  const scale = Math.min((CW-2*PAD)/spanX, (CH-2*PAD)/spanY);

  function compress(v, lo, hi){
    if(v < lo){ const over = lo-v; return lo - MARGIN*(1-1/(1+over/MARGIN)); }
    if(v > hi){ const over = v-hi; return hi + MARGIN*(1-1/(1+over/MARGIN)); }
    return v;
  }
  function project(lat, lon){
    let x = PAD + (lon-lonMin)*cosLat*scale;
    let y = PAD + (latMax-lat)*scale;
    x = compress(x, PAD, CW-PAD) + MARGIN;
    y = compress(y, PAD, CH-PAD) + MARGIN;
    return [x,y];
  }
  const byId = {};
  stations.forEach(s=>{
    const [x,y] = project(s.lat,s.lon);
    s.x=x; s.y=y;
    byId[s.id]=s;
  });

  // ---- normalization / matching ----
  function norm(str){
    return str.toLowerCase()
      .normalize('NFKD')
      .replace(/[\u0300-\u036f]/g,'')
      .replace(/mrt|station|臺|台/g,(m)=> (m==='臺'||m==='台') ? '台' : '') // unify 臺/台, keep 'station'/'mrt' stripped
      .replace(/[^a-z0-9\u4e00-\u9fff]/g,'');
  }
  // build alias table. Value is an array of station ids — a few names (like
  // "三重", used by both the Orange Line and the Airport MRT for two separate
  // physical stations) are legitimately shared, so a guess can resolve to more
  // than one station.
  const aliasMap = {}; // normalized alias -> [station ids]
  function addAlias(alias, id){
    const n = norm(alias);
    if(!n) return;
    if(!aliasMap[n]) aliasMap[n] = [];
    if(!aliasMap[n].includes(id)) aliasMap[n].push(id);
  }
  stations.forEach(s=>{
    addAlias(s.en, s.id);
    addAlias(s.zh, s.id);
    // split combined english names by / or "and"
    s.en.split('/').forEach(part=>addAlias(part,s.id));
    // common short forms
    addAlias(s.en.replace(/\./g,''), s.id);
  });
  // hand aliases for tricky ones
  const extra = {
    "cks":"cks","chiangkaishek":"cks","chiangkaishekmemorialhall":"cks",
    "ntuhospital":"ntuhospital","taidahospital":"ntuhospital","ntuh":"ntuhospital",
    "taipei101":"taipei101","台北101":"taipei101","worldtradecenter":"taipei101","wtc":"taipei101",
    "sysmemorialhall":"sunyatsen","sunyatsenmemorialhall":"sunyatsen",
    "cityhall":"cityhall","taipeicityhall":"cityhall",
    "mainstation":"taipeimain","taipeimainstation":"taipeimain","taipeistation":"taipeimain",
    "zoo":"taipeizoo","taipeizoo":"taipeizoo",
    "minquanwrd":"minquanwrd","minquanwestroad":"minquanwrd",
    // 三重 is a single interchange here: the Orange Line and Airport MRT
    // stations are separate structures in reality, but merged for this quiz.
    "sanchong":"sanchong","sanchongairportmrt":"sanchong",
  };
  Object.keys(extra).forEach(k=>{ addAlias(k, extra[k]); });

  // ---- draw lines (always visible, faint) ----
  const linesLayer = document.getElementById('linesLayer');
  const drawnLineKeys = Object.keys(lines);
  drawnLineKeys.forEach(key=>{
    const base = key.split('_')[0];
    const meta = lineMeta[base];
    const seq = lines[key];
    const pts = seq.map(id=>{ const s=byId[id]; return s.x+','+s.y; }).join(' ');
    const pl = document.createElementNS('http://www.w3.org/2000/svg','polyline');
    pl.setAttribute('points', pts);
    pl.setAttribute('fill','none');
    pl.setAttribute('stroke', meta.color);
    pl.setAttribute('stroke-width','3');
    pl.setAttribute('stroke-linecap','round');
    pl.setAttribute('stroke-linejoin','round');
    pl.setAttribute('opacity','0.85');
    linesLayer.appendChild(pl);
  });

  // ---- draw station dots (background, unfound state) ----
  const dotsLayer = document.getElementById('dotsLayer');
  const labelsLayer = document.getElementById('labelsLayer');
  const dotEls = {}, labelEls = {};

  stations.forEach(s=>{
    const isInterchange = s.lines.length>1;
    const r = isInterchange ? 3.6 : 2.4;
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx', s.x);
    c.setAttribute('cy', s.y);
    c.setAttribute('r', r);
    c.setAttribute('class','station-dot-bg');
    c.setAttribute('data-id', s.id);
    dotsLayer.appendChild(c);
    dotEls[s.id]=c;
  });

  const found = new Set();
  const placedBoxes = []; // {x1,y1,x2,y2} of already-placed labels, for collision avoidance

  function colorForStation(s){
    return lineMeta[s.lines[0]].color;
  }

  // Rough text width estimate: CJK glyphs are ~1em square, Latin glyphs ~0.55em.
  function textWidth(str, fontSize){
    let w = 0;
    for(const ch of str){
      if(/[\u4e00-\u9fff]/.test(ch)) w += fontSize;
      else if(ch === ' ') w += fontSize*0.3;
      else w += fontSize*0.58;
    }
    return w;
  }

  function boxesOverlap(a,b,pad){
    return !(a.x2+pad < b.x1 || b.x2+pad < a.x1 || a.y2+pad < b.y1 || b.y2+pad < a.y1);
  }

  // Candidate label placements around a station dot: dx/dyZh/dyEn are offsets
  // from the station center; anchor controls horizontal text growth direction.
  const LABEL_CANDIDATES = [
    {dx:6,    dyZh:2.2,  dyEn:7.4,  anchor:'start'},  // right (default)
    {dx:-6,   dyZh:2.2,  dyEn:7.4,  anchor:'end'},    // left
    {dx:0,    dyZh:-11,  dyEn:-5.8, anchor:'middle'}, // above
    {dx:0,    dyZh:9,    dyEn:14.2, anchor:'middle'}, // below
    {dx:6,    dyZh:-6,   dyEn:-0.8, anchor:'start'},  // upper-right
    {dx:6,    dyZh:10.5, dyEn:15.7, anchor:'start'},  // lower-right
    {dx:-6,   dyZh:-6,   dyEn:-0.8, anchor:'end'},    // upper-left
    {dx:-6,   dyZh:10.5, dyEn:15.7, anchor:'end'},    // lower-left
  ];

  function computeBox(s, c, ring){
    const scaleUp = 1 + ring*0.85;
    const dx = c.dx*scaleUp;
    const dyZh = c.dyZh<0 ? c.dyZh*scaleUp : (c.dyZh===0?0:c.dyZh + ring*5.5);
    const dyEn = c.dyEn<0 ? c.dyEn*scaleUp : (c.dyEn===0?0:c.dyEn + ring*5.5);
    const zhW = textWidth(s.zh, 6.5);
    const enW = textWidth(s.en, 4.6);
    const maxW = Math.max(zhW, enW);
    const x = s.x + dx;
    let x1,x2;
    if(c.anchor==='start'){ x1=x; x2=x+maxW; }
    else if(c.anchor==='end'){ x1=x-maxW; x2=x; }
    else { x1=x-maxW/2; x2=x+maxW/2; }
    const y1 = s.y + Math.min(dyZh, dyEn) - 5.2;
    const y2 = s.y + Math.max(dyZh, dyEn) + 2.2;
    return {x1,y1,x2,y2, dx, dyZh, dyEn, anchor:c.anchor};
  }

  function placeLabel(s){
    let chosen = null;
    outer:
    for(let ring=0; ring<3; ring++){
      for(const c of LABEL_CANDIDATES){
        const box = computeBox(s, c, ring);
        let collides = false;
        for(const pb of placedBoxes){
          if(boxesOverlap(box, pb, 1.2)){ collides = true; break; }
        }
        if(!collides){ chosen = box; break outer; }
      }
    }
    if(!chosen) chosen = computeBox(s, LABEL_CANDIDATES[0], 0); // fallback: accept overlap
    placedBoxes.push(chosen);
    return chosen;
  }

  function revealStation(id, {silent=false, isGuess=false}={}){
    const s = byId[id];
    if(!s) return false;
    if(found.has(id)) return null; // already found
    found.add(id);
    const dot = dotEls[id];
    dot.setAttribute('class','station-dot-found pop-anim');
    dot.setAttribute('fill', colorForStation(s));
    dot.setAttribute('r', s.lines.length>1 ? 4.4 : 3);

    if(s.lines.length>1){
      const ring = document.createElementNS('http://www.w3.org/2000/svg','circle');
      ring.setAttribute('cx', s.x); ring.setAttribute('cy', s.y);
      ring.setAttribute('r', 6.4);
      ring.setAttribute('class','interchange-ring');
      ring.setAttribute('stroke', '#1c2530');
      dotsLayer.appendChild(ring);
    }

    const box = placeLabel(s);
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    const ty = document.createElementNS('http://www.w3.org/2000/svg','text');
    ty.setAttribute('x', s.x+box.dx); ty.setAttribute('y', s.y+box.dyZh);
    ty.setAttribute('text-anchor', box.anchor);
    ty.setAttribute('class','station-label');
    ty.textContent = s.zh;
    const ty2 = document.createElementNS('http://www.w3.org/2000/svg','text');
    ty2.setAttribute('x', s.x+box.dx); ty2.setAttribute('y', s.y+box.dyEn);
    ty2.setAttribute('text-anchor', box.anchor);
    ty2.setAttribute('class','station-label en');
    ty2.textContent = s.en;
    g.appendChild(ty); g.appendChild(ty2);
    labelsLayer.appendChild(g);
    labelEls[id]=g;

    updateStats();
    addFoundListItem(s, isGuess);
    return true;
  }

  function revealAllRemaining(){
    stations.forEach(s=>{
      if(!found.has(s.id)){
        found.add(s.id);
        const dot = dotEls[s.id];
        dot.setAttribute('class','station-dot-found');
        dot.setAttribute('fill', '#c7ccd4');
        dot.setAttribute('stroke', '#98a1ad');
        const box = placeLabel(s);
        const g = document.createElementNS('http://www.w3.org/2000/svg','g');
        const ty = document.createElementNS('http://www.w3.org/2000/svg','text');
        ty.setAttribute('x', s.x+box.dx); ty.setAttribute('y', s.y+box.dyZh);
        ty.setAttribute('text-anchor', box.anchor);
        ty.setAttribute('class','station-label'); ty.setAttribute('fill','#9098a3');
        ty.textContent = s.zh;
        g.appendChild(ty);
        labelsLayer.appendChild(g);
        addFoundListItem(s, false, true);
      }
    });
    updateStats();
  }

  function updateStats(){
    document.getElementById('foundCount').textContent = found.size;
    document.getElementById('totalCount').textContent = stations.length;
    const pct = (found.size/stations.length*100).toFixed(1);
    document.getElementById('pctCount').textContent = pct+'%';
    document.getElementById('progressBar').style.width = pct+'%';
    if(typeof updateLegendProgress === 'function') updateLegendProgress();
  }

  const foundItemsEl = document.getElementById('foundItems');
  function addFoundListItem(s, isGuess, isReveal=false){
    const row = document.createElement('div');
    row.className = 'found-item'+(isReveal?' reveal':'');
    const badges = s.lines.map(lk=>{
      const lm = lineMeta[lk];
      return '<span class="line-badge" style="background:'+lm.color+'">'+lk+
        '<span class="line-tip">'+lm.name+'</span></span>';
    }).join('');
    row.innerHTML = '<span class="fi-name">'+badges+s.zh+'</span><span class="zh">'+s.en+'</span>';
    foundItemsEl.prepend(row);
  }

  // ---- form handling ----
  const form = document.getElementById('guessForm');
  const input = document.getElementById('guessInput');
  const feedback = document.getElementById('feedback');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    const raw = input.value.trim();
    if(!raw) return;
    const n = norm(raw);
    const ids = aliasMap[n];
    if(!ids || !ids.length){
      feedback.textContent = '"'+raw+'" — 沒有這站 QQ';
      feedback.className = 'feedback no';
      input.select();
      return;
    }
    const newlyFound = [];
    let allAlready = true;
    ids.forEach(id=>{
      const res = revealStation(id, {isGuess:true});
      if(res === true){ newlyFound.push(byId[id]); allAlready = false; }
      else if(res === null){ allAlready = allAlready && true; }
    });
    if(newlyFound.length){
      feedback.textContent = '✓ ' + newlyFound.map(s=>s.zh+' ('+s.en+')').join('  +  ');
      feedback.className = 'feedback ok';
      input.value='';
    } else {
      feedback.textContent = '已解鎖: '+ids.map(id=>byId[id].zh).join(', ');
      feedback.className = 'feedback no';
    }
    input.focus();
  });

  document.getElementById('revealBtn').addEventListener('click', function(){
    if(confirm('公布所有還沒解鎖的車站？')) revealAllRemaining();
  });

  // ---- 交卷 / report card ----
  // Ranks are checked top-down; the first threshold the score clears wins.
  const RANKS = [
    {min:90, title:'捷運大師',   quip:'雙北的路網都在你腦裡，如果沒有偷看，那真的很強。'},
    {min:80, title:'捷運中師',   quip:'幾乎滴水不漏，可能就差三鶯線。'},
    {min:70, title:'捷運小師',   quip:'主要幹線閉著眼都能背，猛。'},
    {min:60, title:'捷運達人',   quip:'常搭的線路一站不漏，出了舒適圈就開始猜。'},
    {min:50, title:'捷運熟客',   quip:'一半的雙北在你腦中，剩下一半靠 Google Maps。'},
    {min:40, title:'捷運通勤族', quip:'家、公司、還有那間常去的餐廳，其他就先不管了。'},
    {min:30, title:'捷運乘客',   quip:'兩點一線，其他不知道。'},
    {min:20, title:'捷運觀光客', quip:'幾個知名景點站沒問題，其他很有問題。'},
    {min:10, title:'捷運新手',   quip:'剛買了悠遊卡的那種程度，前途無量。'},
    {min:5, title:'捷運路人丙',   quip:'看看解答，讀一下再考一次。'},
    {min:1,  title:'捷運路人乙', quip:'有點太爛，加油好嗎？'},
    {min:0,  title:'捷運路人甲', quip:'1%都沒有？你確定你住雙北嗎。'},
  ];
  function rankFor(pct){ return RANKS.find(r=>pct>=r.min) || RANKS[RANKS.length-1]; }

  const overlay = document.getElementById('reportOverlay');
  let submitted = false;

  let finalScore = null; // snapshot taken at 交卷, so 公布解答 can't inflate it

  function showReport(){
    if(!finalScore){
      finalScore = {
        count: found.size,
        perLine: Object.fromEntries(Object.keys(lineMeta).map(k=>{
          let f = 0;
          stations.forEach(s=>{ if(s.lines.includes(k) && found.has(s.id)) f++; });
          return [k, f];
        })),
      };
    }
    const pctNum = finalScore.count/stations.length*100;
    const pct = pctNum.toFixed(1);
    const rank = rankFor(pctNum);
    const d = new Date();
    const dateStr = d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
    document.getElementById('rpDate').textContent = dateStr;
    document.getElementById('rpRank').textContent = rank.title;
    document.getElementById('rpQuip').textContent = rank.quip;
    document.getElementById('rpScore').textContent = pct+'%';
    document.getElementById('rpCount').textContent = finalScore.count+' / '+stations.length+' 站';
    document.getElementById('rpBar').style.width = Math.max(pctNum,0.8)+'%';

    const linesEl = document.getElementById('rpLines');
    linesEl.innerHTML = Object.keys(lineMeta).map(k=>{
      const tot = lineTotals[k];
      const f = finalScore.perLine[k] || 0;
      const lp = tot ? Math.round(f/tot*100) : 0;
      return '<div class="rp-line"><span class="sw" style="background:'+lineMeta[k].color+
        '"></span>'+lineMeta[k].name.replace(/\s*\(.*\)$/,'')+
        '<span class="v">'+lp+'%</span></div>';
    }).join('');

    overlay.classList.add('show');
  }

  function endGame(){
    submitted = true;
    input.disabled = true;
    input.placeholder = '已交卷';
    form.querySelector('button[type=submit]').disabled = true;
    document.getElementById('submitBtn').textContent = '看成績單';
    feedback.textContent = '已交卷 — 成績已結算';
    feedback.className = 'feedback ok';
  }

  document.getElementById('submitBtn').addEventListener('click', function(){
    if(submitted){ showReport(); return; }
    if(!confirm('確定交卷？交卷後就不能再作答了。')) return;
    endGame();
    showReport();
  });
  document.getElementById('rpRestart').addEventListener('click', ()=> location.reload());
  document.getElementById('rpReveal').addEventListener('click', function(){
    overlay.classList.remove('show');
    revealAllRemaining();
  });
  overlay.addEventListener('click', e=>{ if(e.target === overlay) overlay.classList.remove('show'); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') overlay.classList.remove('show'); });

  // ---- legend ----
  const legendEl = document.getElementById('legend');
  const lineTotals = {}, legendProgEls = {};
  Object.keys(lineMeta).forEach(k=>{
    lineTotals[k] = stations.filter(s=>s.lines.includes(k)).length;
  });
  Object.keys(lineMeta).forEach(k=>{
    const m = lineMeta[k];
    const row = document.createElement('div');
    row.className='legend-row';
    row.innerHTML = '<span class="swatch" style="background:'+m.color+'"></span><b>'+m.name+
      '</b><span class="legend-prog" id="legend-prog-'+k+'"></span>';
    legendEl.appendChild(row);
    legendProgEls[k] = row.querySelector('.legend-prog');
  });
  function updateLegendProgress(){
    Object.keys(lineMeta).forEach(k=>{
      let f = 0;
      stations.forEach(s=>{ if(s.lines.includes(k) && found.has(s.id)) f++; });
      const tot = lineTotals[k];
      const pct = tot ? (f/tot*100).toFixed(0) : 0;
      legendProgEls[k].textContent = f+'/'+tot+' · '+pct+'%';
    });
  }

  // ---- viewBox / pan & zoom ----
  const svg = document.getElementById('svg');
  svg.setAttribute('viewBox', '0 0 '+W+' '+H);
  const viewport = document.getElementById('viewport');
  let vb = {x:0,y:0,w:W,h:H};
  function applyVB(){ svg.setAttribute('viewBox', vb.x+' '+vb.y+' '+vb.w+' '+vb.h); }

  const mapArea = document.getElementById('mapArea');
  let isPanning=false, start={x:0,y:0}, startVB=null;
  const pointers = new Map();   // active touch/pointer positions
  let pinch = null;             // {dist, cx, cy} in screen coords when pinch begins
  mapArea.addEventListener('pointerdown', e=>{
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    mapArea.setPointerCapture(e.pointerId);
    if(pointers.size === 1){
      isPanning=true; start={x:e.clientX,y:e.clientY}; startVB={...vb};
    } else if(pointers.size === 2){
      isPanning=false;
      pinch = pinchState();
    }
  });
  function pinchState(){
    const pts = [...pointers.values()];
    const dx = pts[0].x-pts[1].x, dy = pts[0].y-pts[1].y;
    return { dist: Math.hypot(dx,dy), cx:(pts[0].x+pts[1].x)/2, cy:(pts[0].y+pts[1].y)/2 };
  }
  mapArea.addEventListener('pointermove', e=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const rect = mapArea.getBoundingClientRect();
    if(pointers.size >= 2 && pinch){
      const now = pinchState();
      if(now.dist > 0){
        const px = vb.x + (now.cx-rect.left)/rect.width*vb.w;
        const py = vb.y + (now.cy-rect.top)/rect.height*vb.h;
        zoomAt(pinch.dist/now.dist, px, py);
      }
      pinch = now;
      return;
    }
    if(!isPanning) return;
    const scaleX = vb.w/rect.width, scaleY = vb.h/rect.height;
    vb.x = startVB.x - (e.clientX-start.x)*scaleX;
    vb.y = startVB.y - (e.clientY-start.y)*scaleY;
    applyVB();
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>{
    mapArea.addEventListener(ev, e=>{
      pointers.delete(e.pointerId);
      if(pointers.size < 2) pinch = null;
      if(pointers.size === 1){
        const p = [...pointers.values()][0];
        isPanning=true; start={x:p.x, y:p.y}; startVB={...vb};
      } else if(pointers.size === 0){
        isPanning=false;
      }
    });
  });
  function zoomAt(factor, cx, cy){
    const nw = Math.max(60, Math.min(W*2.2, vb.w*factor));
    const nh = nw * (vb.h/vb.w);
    const relX = (cx - vb.x)/vb.w, relY = (cy - vb.y)/vb.h;
    vb.x = cx - relX*nw; vb.y = cy - relY*nh;
    vb.w = nw; vb.h = nh;
    applyVB();
  }
  mapArea.addEventListener('wheel', e=>{
    e.preventDefault();
    const rect = mapArea.getBoundingClientRect();
    const px = vb.x + (e.clientX-rect.left)/rect.width*vb.w;
    const py = vb.y + (e.clientY-rect.top)/rect.height*vb.h;
    zoomAt(e.deltaY>0 ? 1.12 : 0.89, px, py);
  }, {passive:false});
  document.getElementById('zoomIn').addEventListener('click', ()=> zoomAt(0.8, vb.x+vb.w/2, vb.y+vb.h/2));
  document.getElementById('zoomOut').addEventListener('click', ()=> zoomAt(1.25, vb.x+vb.w/2, vb.y+vb.h/2));
  document.getElementById('zoomReset').addEventListener('click', ()=>{ vb={x:0,y:0,w:W,h:H}; applyVB(); });

  updateStats();
  input.focus();
};

main();
</script>
</body>
</html>
